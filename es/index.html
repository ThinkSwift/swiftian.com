  <style>
    :root{
      --bg:#0b0f1a; --bg-2:#0e1422; --ink:#eef2ff; --muted:#9aa6c4; --line:rgba(255,255,255,.10);
      --c1:#6ee7f9; --c2:#818cf8;
    }
    *{box-sizing:border-box}
    html,body{margin:0}
    body{
      font-family:"Inter",-apple-system,system-ui,sans-serif;color:var(--ink);
      background:
        radial-gradient(1200px 700px at 82% -12%, rgba(129,140,248,.20), transparent 60%),
        radial-gradient(1000px 640px at 0% 8%, rgba(110,231,249,.14), transparent 55%),
        linear-gradient(180deg,var(--bg-2),var(--bg));
      min-height:100vh;-webkit-font-smoothing:antialiased
    }
    .wrap{position:relative;z-index:1;width:100%;max-width:880px;margin:0 auto;padding:0 22px}

    nav{display:flex;align-items:center;justify-content:flex-end;gap:11px;padding:26px 0 8px;min-height:34px}
    nav img{width:34px;height:34px;display:block;image-rendering:pixelated}
    nav .name{font-family:"Space Grotesk";font-weight:700;font-size:19px;letter-spacing:.2px;flex:1}
    .lang-toggle{font-size:13px;font-weight:600;color:var(--muted);border:1px solid var(--line);
      background:none;border-radius:999px;padding:7px 14px;cursor:pointer;font-family:inherit;
      transition:color .14s ease,border-color .14s ease}
    .lang-toggle:hover{color:var(--c1);border-color:rgba(110,231,249,.4)}
    .lang-toggle.hide{display:none}

    .kicker{font-family:"Space Grotesk";font-weight:600;font-size:13px;letter-spacing:.14em;text-transform:uppercase;
      color:var(--muted);margin:34px 0 10px}
    h1{font-family:"Space Grotesk";font-weight:700;font-size:clamp(32px,6vw,50px);line-height:1.05;margin:0;letter-spacing:-1.2px;
      background:linear-gradient(100deg,#fff 30%,var(--c1) 75%,var(--c2));-webkit-background-clip:text;background-clip:text;color:transparent}
    .intro{color:var(--muted);font-size:clamp(15px,2.3vw,17px);line-height:1.65;margin:14px 0 0;max-width:600px}

    /* ── 플레이어 ── */
    .stage{margin:28px 0 0;border:1px solid var(--line);border-radius:22px;overflow:hidden;
      background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.02))}
    .video-box{background:#000;display:flex;justify-content:center}
    .video-box video{display:block;width:100%;max-height:min(66vh,560px);object-fit:contain;background:#000}
    /* Listen 은 그 회차의 그림 위에서 듣는다 — 앱 아이콘을 재생면에 두면 연재물이 광고로 읽힌다
       (founder 2026-09-15: "red panda 를 넣으면 chillfriends app 과 혼동된다") */
    .audio-box{position:relative;width:100%;display:flex;flex-direction:column;justify-content:flex-end;
      gap:14px;padding:22px;background:#000;overflow:hidden}
    .audio-box #aposter{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
    .audio-box .a-veil{position:absolute;inset:0;                       /* 컨트롤이 앉을 자리만 어둡게 */
      background:linear-gradient(180deg,rgba(6,9,16,0) 55%,rgba(6,9,16,.78))}
    .audio-box audio{position:relative;width:100%}
    .modes{display:flex;gap:4px;padding:3px;border:1px solid var(--line);border-radius:999px}
    .mode{font:inherit;font-size:12.5px;font-weight:600;color:var(--muted);background:none;border:0;
      padding:5px 13px;border-radius:999px;cursor:pointer}
    .mode.on{background:var(--c1);color:#0b0f1a}

    /* ── 다른 사이트 통로 ── */
    .more{margin:52px 0 0;padding-top:24px;border-top:1px solid var(--line)}
    .more h2{font-family:"Space Grotesk";font-weight:600;font-size:13px;letter-spacing:.14em;text-transform:uppercase;
      color:var(--muted);margin:0 0 12px}
    .site-row{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;padding:7px 0;font-size:14.5px}
    .site-row a{color:var(--c1);text-decoration:none;font-weight:600;font-family:"Space Grotesk"}
    .site-row a:hover{text-decoration:underline;text-underline-offset:3px}
    .site-row .d{color:var(--muted)}
    .site-row .soon{font-size:11.5px;color:var(--muted);border:1px dashed var(--line);border-radius:999px;padding:2px 9px;opacity:.8}

    /* ── 엽서 한 자리 + 두 갈래 문 (PLAN-2026-09-15-landing §4-2) ──
       엽서는 여기서 목적지가 아니라 갈림길의 미끼다. 한 장만 보여 주고 문 두 개를 연다. */
    .also{display:flex;gap:26px;margin:46px 0 0;padding-top:22px;border-top:1px solid var(--line)}
    .also a{display:flex;flex-direction:column;align-items:center;gap:7px;color:var(--muted);text-decoration:none;font-size:13px}
    .also a:hover{color:var(--ink)}
    .also img{width:52px;height:52px;border-radius:12px}
    .pc{margin:52px 0 0;padding-top:24px;border-top:1px solid var(--line)}
    .pc h2{font-family:"Space Grotesk";font-weight:600;font-size:13px;letter-spacing:.14em;
      text-transform:uppercase;color:var(--muted);margin:0 0 12px}
    .pc-box{display:grid;grid-template-columns:minmax(0,1.35fr) 1fr;gap:20px;align-items:start}
    .pc-box video{width:100%;aspect-ratio:16/9;display:block;border-radius:14px;border:1px solid var(--line);background:#000}
    .pc-side{display:flex;flex-direction:column;gap:5px;padding-top:2px}
    .pc-n{font-size:11.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--c1)}
    .pc-t{font-family:"Space Grotesk";font-weight:600;font-size:18px;line-height:1.3}
    .pc-v{margin:4px 0 0;color:var(--muted);font-size:14px;line-height:1.6;white-space:pre-line}
    .pc-more{align-self:flex-start;margin-top:10px;font:inherit;font-size:12.5px;font-weight:600;
      color:var(--muted);background:none;border:1px solid var(--line);border-radius:999px;
      padding:6px 14px;cursor:pointer;transition:color .14s ease,border-color .14s ease}
    .pc-more:hover{color:var(--c1);border-color:rgba(110,231,249,.4)}
    .pc-note{margin:12px 0 0;font-size:12px;line-height:1.5;color:var(--muted);opacity:.75}

    .doors{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:22px 0 0}
    .door{display:flex;align-items:center;gap:13px;flex-wrap:wrap;text-decoration:none;color:inherit;
      border:1px solid var(--line);border-radius:16px;padding:15px 17px;
      background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.015));
      transition:border-color .13s ease,transform .13s ease}
    .door:hover{transform:translateY(-2px);border-color:rgba(110,231,249,.35)}
    .door img{width:46px;height:46px;border-radius:11px;border:1px solid rgba(255,255,255,.10);
      box-shadow:0 4px 12px rgba(0,0,0,.35);flex:none}
    .door .d-name{font-family:"Space Grotesk";font-weight:600;font-size:15.5px;color:var(--c1)}
    .door .d-line{flex:1 1 100%;color:var(--muted);font-size:13.5px;line-height:1.45}

    @media (max-width:640px){
      .pc-box{grid-template-columns:1fr}
      .doors{grid-template-columns:1fr}
    }

    footer{position:relative;z-index:1;text-align:center;font-size:13px;padding:44px 22px 34px;color:var(--muted)}
    footer a{color:var(--c1);text-decoration:none}
    footer a:hover{text-decoration:underline;text-underline-offset:3px}
    footer a.mail{display:inline-flex;vertical-align:-3px}
    footer a.mail:hover{text-decoration:none;opacity:.75}
    footer a.mail svg{width:16px;height:16px}
    footer .sep{opacity:.35;margin:0 9px}

    /* ── 개편 2026-09-15 ─────────────────────────────────────────────
       1. `hidden` 을 존중한다. `.audio-box{display:flex}` 와 `video{display:block}` 가
          UA 의 `[hidden]{display:none}` 을 이겨서, Watch 에서도 빈 오디오 플레이어가,
          Listen 에서도 영상이 그대로 남아 있었다 (founder 2026-09-15).
       2. 영상이 1:1(1080×1080)이다. 880px 폭에 꽉 채우면 화면 하나를 통째로 먹고
          양옆이 검은 띠가 된다. 정사각은 정사각 자리에 두고, 남는 폭을 정보에 준다. */
    .video-box video[hidden],
    .audio-box[hidden]{display:none}

    .stage{display:grid;grid-template-columns:minmax(0,420px) 1fr;align-items:start}
    .video-box{aspect-ratio:1/1}
    .video-box video{width:100%;height:100%;max-height:none}
    .audio-box{height:100%}

    /* ── 트랙리스트 (2026-10-14): 버튼 카드 24장 대신, 정사각 옆 빈 칸에 한 앨범씩 제목만 ──
       번호·회차 표기는 없다 (founder 10/14). 지금 곡은 밝게, 재생 중이면 막대 셋이 움직인다. */
    .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
    .side{display:flex;flex-direction:column;min-height:100%;padding:22px 24px 18px;border-left:1px solid var(--line)}
    .album{display:flex;align-items:center;gap:8px;margin:0 0 8px}
    .a-name{flex:1;min-width:0;font-family:"Space Grotesk";font-weight:600;font-size:12px;letter-spacing:.14em;
      text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .arrow{flex:none;width:28px;height:28px;display:grid;place-items:center;padding:0 0 2px;font:500 18px/1 Inter,system-ui;
      color:var(--muted);background:none;border:1px solid var(--line);border-radius:50%;cursor:pointer;
      transition:color .14s ease,border-color .14s ease,opacity .14s ease}
    .arrow:hover{color:var(--ink);border-color:rgba(255,255,255,.3)}
    .arrow:disabled{opacity:.25;cursor:default;color:var(--muted);border-color:var(--line)}
    .tracks{list-style:none;margin:0;padding:0}
    .tracks li+li .tr{border-top:1px solid rgba(255,255,255,.06)}
    .tr{width:100%;display:flex;align-items:center;gap:12px;padding:9px 2px;text-align:left;cursor:pointer;
      font:500 14.5px/1.35 Inter,system-ui,sans-serif;color:var(--muted);background:none;border:0;
      transition:color .14s ease}
    .tr:hover{color:var(--ink)}
    .tr .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .tr.on{color:var(--ink)}
    .eq{flex:none;width:12px;height:11px;display:flex;align-items:flex-end;gap:2px;opacity:0}
    .eq i{flex:1;height:30%;background:var(--c1);border-radius:1px}
    .tr.on .eq{opacity:1}
    .playing .tr.on .eq i{animation:eq .9s ease-in-out infinite alternate}
    .playing .tr.on .eq i:nth-child(2){animation-delay:-.45s}
    .playing .tr.on .eq i:nth-child(3){animation-delay:-.2s}
    @keyframes eq{from{height:20%}to{height:100%}}
    @media (prefers-reduced-motion:reduce){.playing .tr.on .eq i{animation:none;height:70%}}
    .foot{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:auto;padding-top:16px}
    .full-link{font-size:12px;font-weight:600;color:var(--muted);text-decoration:none;
      border-bottom:1px solid transparent;transition:color .13s ease,border-color .13s ease}
    .full-link:hover{color:var(--c1);border-bottom-color:currentColor}

    @media (max-width:820px){
      .stage{grid-template-columns:1fr}
      .side{border-left:0;border-top:1px solid var(--line);padding:16px 18px 16px}
    }
  
    /* swiftian.com's three pages: top tabs on the header line (RDM-swiftian-three-pages) */
    nav.tabs-bar{display:flex;align-items:flex-end;justify-content:flex-start;gap:11px;padding:22px 0 0;min-height:0;border-bottom:1px solid rgba(255,255,255,.22)}
    .tabs{display:flex;gap:8px}
    .tab{box-sizing:border-box;width:168px;min-height:44px;display:flex;align-items:center;gap:9px;padding:6px 10px 6px 8px;margin-bottom:-1px;
      color:var(--muted);text-decoration:none;font-size:13.5px;line-height:1.15;background:rgba(255,255,255,.03);
      border:1px solid rgba(255,255,255,.16);border-bottom:none;border-radius:10px 10px 0 0}
    .tab img,.site img{display:block;flex:none;width:32px;height:32px;image-rendering:pixelated}
    .tab:hover{border-color:rgba(238,242,255,.75);color:var(--ink)}
    .tab[aria-current]{border-color:var(--ink);border-top-width:3px;padding-top:4px;color:var(--ink)}
    nav.tabs-bar .lang-toggle{margin:0 0 8px auto}
    /* other sites: light round-rect buttons */
    .sites{display:flex;flex-wrap:wrap;gap:8px;margin:46px 0 0;padding-top:22px;border-top:1px solid var(--line)}
    .site{box-sizing:border-box;width:168px;min-height:42px;display:flex;align-items:center;gap:8px;padding:3px 10px 3px 3px;
      color:#0b0f1a;text-decoration:none;font-size:13.5px;font-weight:500;background:#eef1f7;border:2px solid #eef1f7;border-radius:10px}
    .site img{border-radius:6px}
    .site:hover{border-color:#0b0f1a}
    /* the page's own app: one App Store link at the bottom */
    .store-row{display:flex;justify-content:center;margin:40px 0 0}
    .store{display:inline-flex;align-items:center;gap:10px;min-height:52px;padding:8px 18px 8px 10px;border-radius:14px;
      background:#000;color:#fff;text-decoration:none;border:1px solid rgba(255,255,255,.28)}
    .store:hover{border-color:#fff}
    .store img{border-radius:7px}
    .store span{display:flex;flex-direction:column;line-height:1.05}
    .store small{font-size:10.5px;letter-spacing:.02em;opacity:.85}
    .store b{font:600 19px/1.1 "Inter",-apple-system,system-ui,sans-serif;letter-spacing:-.01em}
    @media (max-width:540px){
      .tabs{flex:1 1 100%;gap:6px}
      .tab{width:auto;flex:1;flex-direction:column;text-align:center;gap:5px;padding:8px 4px;font-size:12px}
      .tab[aria-current]{padding-top:6px}
      nav.tabs-bar{flex-wrap:wrap}
      nav.tabs-bar .lang-toggle{order:-1;margin:0 0 10px auto}
      .site{flex:1;width:auto}
    }
</style>
